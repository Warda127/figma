<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechNova - Health Information</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#102542',
                        coral: '#F87060',
                        grayLight: '#F3F4F6'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-grayLight">
    <!-- Navigation Bar -->
    <header class="p-4 bg-white shadow-md flex justify-between items-center">
        <h1 class="text-2xl font-bold text-blue-700">TechNova</h1>
        <nav>
          <ul class="flex gap-4 text-sm font-medium">
            <li><a href="index.html" class="text-red-500">Home</a></li>
            <li><a href="#" class="text-gray-600">Contact</a></li>
            <li><a href="#" class="text-gray-600">About Us</a></li>
          </ul>
        </nav>
    
        <a href="login.html" class="bg-blue-900 text-white px-4 py-2 rounded">Login</a>
      </header>
    

    <!-- Main Content -->
    <div class="container mx-auto p-6 max-w-2xl">
        <h1 class="text-2xl font-bold mb-6 text-navy">Complete Health Profile</h1>

        <div class="bg-white p-8 rounded-xl shadow-lg">
            <form id="infoForm" class="space-y-6">
                <div>
                    <label class="block text-navy font-medium mb-2">Average Heart Rate (bpm)</label>
                    <input type="number" id="heartRate" 
                           class="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-coral outline-none"
                           placeholder="e.g. 72">
                </div>

                <div>
                    <label class="block text-navy font-medium mb-2">Current Medications</label>
                    <textarea id="medications" 
                              class="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-coral outline-none"
                              placeholder="List all medications separated by commas"></textarea>
                </div>

                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-navy font-medium mb-2">Blood Glucose (mg/dL)</label>
                        <input type="number" id="bloodGlucose" 
                               class="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-coral outline-none"
                               placeholder="e.g. 100">
                    </div>
                    
                    <div>
                        <label class="block text-navy font-medium mb-2">Blood Pressure (mmHg)</label>
                        <input type="text" id="bloodPressure" 
                               class="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-coral outline-none"
                               placeholder="e.g. 120/80">
                    </div>
                </div>

                <div>
                    <label class="block text-navy font-medium mb-2">Weight (kg)</label>
                    <input type="number" id="weight" 
                           class="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-coral outline-none"
                           placeholder="e.g. 70">
                </div>
                <button type="button" 
                class="w-full bg-red-500 text-white py-2 rounded-lg hover:bg-red-600" 
                onclick="window.location.href='login.html'">
                Save Health Profile
        </button>
               
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="p-6 bg-gray-200">
        <div class="flex flex-col md:flex-row justify-between gap-4">
          <p class="text-sm font-medium text-navy">TechNova</p>
          <p class="text-sm text-center font-medium text-gray-600">
            Learn, Teach, Grow<br>
            An AI-powered platform for skill exchange and mentorship.
          </p>
          <div>
            <p class="text-sm font-medium text-navy">Support</p>
            <p class="text-xs text-gray-600">support@technova.com</p>
            <p class="text-xs text-gray-600">&copy; 2025 TechNova. All Rights Reserved.</p>
          </div>
        </div>
      </footer>

    <script>
        document.getElementById('infoForm').addEventListener('submit', function(event) {
            event.preventDefault();
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
